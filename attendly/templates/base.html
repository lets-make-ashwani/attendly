<!DOCTYPE html>
<html>
<head>
    <title>Attendly</title>

    <!-- ✅ MOBILE FIX -->


    {% load static %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}?v=3">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
            background: #f5f7fb;
        }

        /* ===== LAYOUT ===== */
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
            transition: 0.3s;
        }

        .sidebar h2 {
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            margin-bottom: 10px;
        }

        .sidebar ul li a {
            display: block;
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
        }

        .sidebar ul li a:hover {
            background: rgba(255,255,255,0.15);
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            padding: 15px;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .navbar input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
        }

        /* ===== MENU BUTTON ===== */
        .menu-btn {
            font-size: 22px;
            cursor: pointer;
            display: none;
        }

        /* ===== MOBILE FIX ===== */
        @media (max-width: 768px) {

            /* 👉 IMPORTANT CHANGE */
            .layout {
                display: block;
            }

            /* 👉 SIDEBAR OVERLAY */
            .sidebar {
                position: fixed;
                top: 0;
                left: -260px;
                height: 100%;
                z-index: 1000;
                width: 250px;
                box-shadow: 0 0 20px rgba(0,0,0,0.3);
            }

            .sidebar.active {
                left: 0;
            }

            /* 👉 MAIN FULL WIDTH */
            .main {
                width: 100%;
                padding: 10px;
            }

            /* 👉 SHOW MENU BUTTON */
            .menu-btn {
                display: block;
            }

            /* 👉 NAVBAR STACK FIX */
            .navbar {
                flex-wrap: wrap;
            }

            .navbar input {
                width: 100%;
                order: 3;
            }

            /* 👉 OVERLAY BACKDROP */
            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.4);
                z-index: 900;
                display: none;
            }

            .overlay.active {
                display: block;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <h2>Attendly</h2>

        <ul>
            {% if request.user.is_admin %}
                <li><a href="{% url 'admin_dashboard' %}">Admin Dashboard</a></li>
                <li><a href="{% url 'employees' %}">Employees List</a></li>
                <li><a href="{% url 'attendance' %}">Attendance</a></li>
                <li><a href="{% url 'reports' %}">Reports</a></li>
                <li><a href="{% url 'qr_generator' %}">QR Generator</a></li>
            {% else %}
                <li><a href="{% url 'dashboard' %}">My Dashboard</a></li>
                <li><a href="{% url 'scanner_page' %}">QR Scanner</a></li>
            {% endif %}
        </ul>
    </div>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- MAIN -->
    <div class="main">

        <!-- NAVBAR -->
        <div class="navbar">

            <div class="menu-btn" onclick="toggleSidebar()">☰</div>

            <form method="GET" action="#" style="flex: 1; display: flex;">
                <input type="text" name="q" placeholder="Search...">
            </form>

            <div style="display:flex; align-items:center; gap:10px;">
                <span>{{ request.user.username }}</span>
                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            </div>

        </div>

        {% block content %}{% endblock %}

    </div>

</div>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}
</script>

</body>
</html>
