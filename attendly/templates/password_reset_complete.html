<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendly - Password Reset Complete</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #333; }
        .btn { display: inline-block; width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; text-decoration: none; box-sizing: border-box; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 50px; margin-bottom: 10px;">✅</div>
        <h2>Password Reset Complete</h2>
        <p style="color: #555; font-size: 16px;">Your password has been successfully updated. You may go ahead and log in now.</p>
        <a href="{% url 'login' %}" class="btn">Log in to your account</a>
    </div>
</body>
</html>
