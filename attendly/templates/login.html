<!DOCTYPE html>
<html>
<head>
    <title>Attendly Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <h2>Attendly</h2>
        <p>Employee Attendance System</p>

        <form method="POST">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>
        
        <!-- Forgot Password Link -->
        <div style="text-align: center; margin-top: 15px;">
            <a href="{% url 'password_reset' %}" style="color: #3b82f6; text-decoration: none; font-size: 14px; font-weight: 500;">Forgot password?</a>
        </div>
        
        <!-- Register Link -->
        <div style="text-align: center; margin-top: 15px; font-size: 14px;">
            Don't have an account? <a href="{% url 'register' %}" style="color: #3b82f6; text-decoration: none; font-weight: 500;">Register here</a>
        </div>

        <p class="error">{{ error }}</p>
    </div>
</div>

</body>
</html>
