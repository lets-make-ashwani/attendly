{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="card" style="text-align: center; padding: 40px; margin-top: 20px;">
        <h2>🖨️ Office QR Code</h2>
        <p style="color: #666; margin-bottom: 20px;">Print this and place it at the office entrance.</p>
        
        <img src="data:image/png;base64,{{ qr_image }}" alt="QR Code" style="border: 5px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 10px; width: 250px;">
        <br><br>
        <p style="font-family: monospace; background: #f4f4f9; padding: 10px; display: inline-block; border-radius: 5px;">{{ scanner_url }}</p>
        <br><br>
        <button onclick="window.print()" style="background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Print QR Code</button>
    </div>
</div>
{% endblock %}
