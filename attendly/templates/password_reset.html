<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendly - Reset Password</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #0056b3; }
        .back-link { margin-top: 20px; font-size: 14px; }
        .back-link a { color: #007bff; text-decoration: none; }
        .helptext { color: #666; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Password</h2>
        <p class="helptext">Forgotten your password? Enter your email address below, and we'll email instructions for setting a new one.</p>
        
        <form method="POST">
            {% csrf_token %}
            
            <!-- Renders the email input and validation errors automatically -->
            <div style="text-align: left; margin: 15px 0; font-size: 14px; color: #333;">
                {{ form.as_p }} 
            </div>
            
            <button type="submit">Send Reset Email</button>
        </form>
        
        <div class="back-link">
            <p>Remembered your password? <a href="{% url 'login' %}">Log in</a></p>
        </div>
    </div>
</body>
</html>
